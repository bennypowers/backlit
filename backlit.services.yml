services:
  backlit.renderer:
    class: Drupal\backlit\Service\LitSsrRenderer
    arguments: ['@config.factory']

  backlit.response_subscriber:
    class: Drupal\backlit\EventSubscriber\SsrResponseSubscriber
    arguments: ['@backlit.renderer', '@router.admin_context', '@config.factory']
    tags:
      - { name: event_subscriber }
